<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Send to Isabella</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#111;color:#fff;display:grid;place-items:center;padding:20px}
.card{width:min(430px,100%);background:#1b1b1b;border:1px solid #2a2a2a;border-radius:22px;padding:22px;box-shadow:0 16px 50px #0008}
h1{font-size:25px;margin:0 0 8px}
p{opacity:.76;margin:0 0 18px;line-height:1.45}
input{display:block;width:100%;margin:8px 0 14px}
canvas{display:block;width:100%;aspect-ratio:4/3;background:#000;border-radius:14px;margin-bottom:14px}
button{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:17px;font-weight:750;background:#fff;color:#111;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#status{min-height:24px;margin-top:12px;font-size:14px}
.small{font-size:12px;opacity:.55;margin-top:8px}
</style>
</head>
<body>
<div class="card">
  <h1>Send to Isabella</h1>
  <p>Choose a photo. It will be center-cropped to 320×240 and converted directly to RGB565 for the mailbox screen.</p>
  <input id="file" type="file" accept="image/*">
  <canvas id="canvas" width="320" height="240"></canvas>
  <button id="send" disabled>Send photo</button>
  <div id="status"></div>
  <div class="small">The mailbox checks every 10 seconds and only redraws when the photo changes.</div>
</div>

<script>
const UPLOAD_URL='https://jfzjrudshkkeeweavcuq.supabase.co/functions/v1/isabella-upload';
const W=320, H=240, EXPECTED_BYTES=W*H*2;

const fileInput=document.getElementById('file');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{alpha:false,willReadFrequently:true});
const sendButton=document.getElementById('send');
const statusEl=document.getElementById('status');

let preparedBlob=null;

function drawCover(img){
  const targetRatio=W/H;
  const iw=img.naturalWidth, ih=img.naturalHeight, ratio=iw/ih;
  let sx=0, sy=0, sw=iw, sh=ih;

  if(ratio>targetRatio){
    sw=ih*targetRatio;
    sx=(iw-sw)/2;
  }else{
    sh=iw/targetRatio;
    sy=(ih-sh)/2;
  }

  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);
  ctx.drawImage(img,sx,sy,sw,sh,0,0,W,H);
}

function canvasToRGB565Blob(){
  const rgba=ctx.getImageData(0,0,W,H).data;
  const out=new Uint8Array(EXPECTED_BYTES);
  let j=0;

  for(let i=0;i<rgba.length;i+=4){
    const r=rgba[i];
    const g=rgba[i+1];
    const b=rgba[i+2];

    const pixel=((r & 0xF8)<<8)|((g & 0xFC)<<3)|(b>>3);

    // Store each RGB565 pixel as high byte, then low byte.
    out[j++]=(pixel>>8)&0xFF;
    out[j++]=pixel&0xFF;
  }

  return new Blob([out],{type:'application/octet-stream'});
}

fileInput.addEventListener('change',()=>{
  preparedBlob=null;
  sendButton.disabled=true;
  statusEl.textContent='';

  const file=fileInput.files && fileInput.files[0];
  if(!file) return;

  const objectUrl=URL.createObjectURL(file);
  const img=new Image();

  img.onload=()=>{
    try{
      drawCover(img);
      preparedBlob=canvasToRGB565Blob();
      URL.revokeObjectURL(objectUrl);

      if(preparedBlob.size!==EXPECTED_BYTES){
        preparedBlob=null;
        statusEl.textContent='Could not prepare this photo.';
        return;
      }

      sendButton.disabled=false;
      statusEl.textContent='Ready • 150 KB • RGB565';
    }catch(e){
      URL.revokeObjectURL(objectUrl);
      preparedBlob=null;
      statusEl.textContent='Could not prepare this photo.';
    }
  };

  img.onerror=()=>{
    URL.revokeObjectURL(objectUrl);
    statusEl.textContent='That image could not be opened.';
  };

  img.src=objectUrl;
});

sendButton.addEventListener('click',async()=>{
  if(!preparedBlob) return;

  sendButton.disabled=true;
  statusEl.textContent='Sending…';

  try{
    const response=await fetch(UPLOAD_URL,{
      method:'POST',
      headers:{'Content-Type':'application/octet-stream'},
      body:preparedBlob,
      cache:'no-store'
    });

    const data=await response.json().catch(()=>({}));

    if(!response.ok){
      throw new Error(data.detail || data.error || 'Upload failed');
    }

    statusEl.textContent='Sent ✓';
  }catch(e){
    statusEl.textContent='Upload failed: '+e.message;
  }finally{
    sendButton.disabled=false;
  }
});
</script>
</body>
</html>
