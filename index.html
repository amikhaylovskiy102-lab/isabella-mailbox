<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Send to Isabella</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#111;color:#fff;display:grid;place-items:center;padding:20px}
.card{width:min(430px,100%);background:#1b1b1b;border:1px solid #2a2a2a;border-radius:22px;padding:22px;box-shadow:0 16px 50px #0008}
h1{font-size:25px;margin:0 0 8px}
p{opacity:.76;margin:0 0 18px;line-height:1.45}
input{display:block;width:100%;margin:8px 0 14px}
canvas{display:block;width:100%;aspect-ratio:4/3;background:#000;border-radius:14px;margin-bottom:14px;object-fit:cover}
button{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:17px;font-weight:750;background:#fff;color:#111;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#status{min-height:24px;margin-top:12px;font-size:14px}
.small{font-size:12px;opacity:.55;margin-top:8px}
</style>
</head>
<body>
<div class="card">
  <h1>Send to Isabella</h1>
  <p>Choose a photo. It will be center-cropped to 320×240 and sent to her mailbox.</p>
  <input id="file" type="file" accept="image/*">
  <canvas id="canvas" width="320" height="240"></canvas>
  <button id="send" disabled>Send photo</button>
  <div id="status"></div>
  <div class="small">The mailbox checks for a new photo every 5 minutes.</div>
</div>
<script>
const UPLOAD_URL='https://jfzjrudshkkeeweavcuq.supabase.co/functions/v1/isabella-upload';
const fileInput=document.getElementById('file');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{alpha:false});
const sendButton=document.getElementById('send');
const statusEl=document.getElementById('status');
let preparedBlob=null;

function drawCover(img){
  const tw=320, th=240, targetRatio=tw/th;
  const iw=img.naturalWidth, ih=img.naturalHeight, ratio=iw/ih;
  let sx=0, sy=0, sw=iw, sh=ih;
  if(ratio>targetRatio){ sw=ih*targetRatio; sx=(iw-sw)/2; }
  else { sh=iw/targetRatio; sy=(ih-sh)/2; }
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,tw,th);
  ctx.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
}

fileInput.addEventListener('change',()=>{
  preparedBlob=null;
  sendButton.disabled=true;
  statusEl.textContent='';
  const file=fileInput.files && fileInput.files[0];
  if(!file) return;
  const objectUrl=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    try{
      drawCover(img);
      canvas.toBlob((jpg)=>{
        URL.revokeObjectURL(objectUrl);
        if(!jpg){ statusEl.textContent='Could not prepare this photo.'; return; }
        preparedBlob=jpg;
        sendButton.disabled=false;
        statusEl.textContent=`Ready • ${Math.round(jpg.size/1024)} KB`;
      },'image/jpeg',0.90);
    }catch(e){
      URL.revokeObjectURL(objectUrl);
      statusEl.textContent='Could not prepare this photo.';
    }
  };
  img.onerror=()=>{
    URL.revokeObjectURL(objectUrl);
    statusEl.textContent='That image could not be opened.';
  };
  img.src=objectUrl;
});

sendButton.addEventListener('click',async()=>{
  if(!preparedBlob) return;
  sendButton.disabled=true;
  statusEl.textContent='Sending…';
  try{
    const response=await fetch(UPLOAD_URL,{
      method:'POST',
      headers:{'Content-Type':'image/jpeg'},
      body:preparedBlob,
      cache:'no-store'
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.detail || data.error || 'Upload failed');
    statusEl.textContent='Sent ✓';
  }catch(e){
    statusEl.textContent='Upload failed: '+e.message;
  }finally{
    sendButton.disabled=false;
  }
});
</script>
</body>
</html>
